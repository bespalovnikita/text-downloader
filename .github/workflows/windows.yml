name: Windows build and release

on:
  push:
    branches: ['**', '!main', '!merge-snapshots/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_commit:
        type: string
        required: true
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, test and package Windows
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Read and validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$definition = Get-Content Version.props -Raw
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { [string]$definition.Project.PropertyGroup.Version }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version.props must contain a stable semantic version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and run core and real WPF tests
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build.ps1 -Task Test -Version $env:BUILD_VERSION
      - name: Publish and launch standalone Windows package
        shell: pwsh
        run: ./scripts/build.ps1 -Task Publish -Version '${{ steps.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: TextDownloader-Windows-x64${{ inputs.release_version && format('-{0}', inputs.release_version) || '' }}
          path: |
            dist/TextDownloader-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified Windows release
    if: inputs.release_commit != ''
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: text-downloader-release
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TextDownloader-Windows-x64${{ inputs.release_version && format('-{0}', inputs.release_version) || '' }}
          path: dist/release-assets
      - name: Publish release without changing existing published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.release_version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          ./scripts/ensure-release-tag.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -CommitSha $env:RELEASE_COMMIT
          ./scripts/publish-release.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -CommitSha $env:RELEASE_COMMIT -AssetDirectory dist/release-assets
