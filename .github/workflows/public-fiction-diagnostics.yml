name: Public fiction catalog diagnostics

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-fiction-diagnostics.yml']

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect catalog and reader markup
        run: |
          python3 -m pip install --quiet lxml
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.error import HTTPError
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          from lxml.html import fromstring

          urls = {
              "sfchapter": "https://book.sfacg.com/Novel/785681/1044447/9954155/",
              "17kchapter": "https://www.17k.com/chapter/3684636/50657210.html",
              "lcp": "https://exiledrebelsscanlations.com/mary-sue-chapter-1/",
              "novellochapter": "https://novello.id/book/the-early-spring/chapter/1",
              "ranahchapter": "https://ranahnovel.com/novel/reverend-insanity/chapter-1",
              "zhenchapter": "https://novelzhen.com/novel/reverend-insanity/reverend-insanity-chapter-1",
              "rpgchapter": "https://rpgnovels.com/villagebuilding_ch1/",
              "booknet": "https://booknet.com/ru",
              "fringe": "https://www.fringecapybara.com/",
              "fuyu": "https://www.fuyuneko.org/",
              "dtruyen": "https://dtruyen.com/",
              "sstruyen": "https://sstruyen.vn/",
              "truyenyy": "https://truyenyy.vip/",
              "truyenhdx": "https://truyenhdx.com/",
              "trumtruyen": "https://trumtruyen.vn/",
              "metruyen": "https://metruyenchu.com.vn/",
              "truyendich": "https://truyendich.vn/",
              "tangthuvien": "https://tangthuvien.net/",
              "author": "https://author.today/",
              "litgorod": "https://litgorod.ru/catalog",
              "rodovia": "https://rodoviadasnovels.com.br/",
              "abismo": "https://abismonovel.com.br/",
              "novelworld": "https://novelworldtranslations.com/",
              "athena": "https://athenatls.com/",
              "novelrealm": "https://novelrealm.com/",
              "lc": "https://www.lcfanfic.com/",
              "fanficw": "https://ficwad.com/story/162133",
              "fanficauth": "https://www.fanficauthors.net/",
              "fictionspain": "https://www.fanfic.es/",
              "wtrlab": "https://wtr-lab.com/",
              "fictionpost": "https://fiction.live/",
              "squidge": "https://squidgeworld.org/works",
              "archive": "https://archiveofourown.org/works/search",
              "novelbin": "https://novelbin.com/",
              "cnovels": "https://cnovels.com/",
              "klikt": "https://kliknovel.com/",
          }

          def clean(value, limit=200):
              return " ".join(value.split())[:limit]

          def describe(node):
              return clean(node.tag + "#" + node.get("id", "") + "." + node.get("class", ""), 130)

          def probe(item):
              name, url = item
              try:
                  with urlopen(Request(url, headers={"User-Agent": "TextDownloader/1.0", "Accept": "text/html,application/xhtml+xml"}), timeout=9) as response:
                      response_url = response.geturl()
                      html = response.read(5 * 1024 * 1024)
                      doc = fromstring(html)
                  text = [f"{name} {response_url} {len(html)} {clean(doc.xpath('string(//title)'))}"]
                  text.append("head " + repr([(describe(h), len(h.text_content())) for h in doc.xpath("//h1|//h2")[:7]]))
                  props = {describe(a):sum(len(p.text_content()) for p in a.xpath("./p")) for a in doc.xpath("//p/parent::* | //div[./br]")}
                  text.append("prose " + repr(sorted(props.items(), key=lambda x:-x[1])[:6]))
                  links = {}
                  for node in doc.xpath("//a[@href]|//option[@value]"):
                      path = node.get("href", node.get("value",""))
                      target = urlsplit(urljoin(response_url, path))
                      if not path or path.startswith(("#", "javascript:")) or target.hostname != urlsplit(response_url).hostname:
                          continue
                      short = clean(node.text_content(), 55)
                      rank = 0
                      signals = ("chapter", "read first", "first chapter", "start reading", "contents", "next", "/book/", "/novel/", "viewstory", "s/", "chapit", "开始", "第一", "阅读")
                      mark = " ".join((path, short, node.get("id",""), node.get("class",""))).lower()
                      if any(k in mark for k in signals):
                          rank += 5
                      if "first" in mark or "chapter-1/" in mark or "starts" in mark or "chuong-1" in mark or "bab-1" in mark:
                          rank += 4
                      absolute = target.path + (("?" + target.query) if target.query else "")
                      if absolute in links:
                          continue
                      links[absolute] = (rank, clean(absolute,160), short, describe(node))
                  text.append("links " + repr([entry[1:] for entry in sorted(links.values(), key=lambda x:-x[0])[:12]]))
                  return "\n".join(text)
              except HTTPError as error:
                  return f"{name} HTTP {error.code} {error.geturl()}"
              except Exception as error:
                  return f"{name} {error}"

          with ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(probe, urls.items()):
                  print(result, flush=True)
          PY
