name: Public fiction catalog diagnostics

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-fiction-diagnostics.yml']

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect catalog and reader markup
        run: |
          python3 -m pip install --quiet lxml
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          import re
          from lxml.html import fromstring, HTMLParser

          works = {
              "cc1": "https://cclawtranslations.home.blog/aoharu-devil-toc/",
              "cc2": "https://cclawtranslations.home.blog/ankoku-kishi-to-issho-toc/",
              "re1": "https://re-library.com/translations/demon-sword-maiden/",
              "re2": "https://re-library.com/translations/dragon-princess/",
              "inf1": "https://infinitenoveltranslations.net/light-novels/atelier-tanaka/",
              "inf2": "https://infinitenoveltranslations.net/light-novels/nidoume-no-jinsei-wo-isekai-de/",
              "inf3": "https://infinitenoveltranslations.net/atelier-tanaka/",
              "inf4": "https://infinitenoveltranslations.net/nidoume-no-jinsei-wo-isekai-de/",
              "pure1": "https://puretl.com/tcfpcd",
              "pure2": "https://puretl.com/tvhba",
              "pure3": "https://puretl.com/gourd-farm",
              "silver1": "https://silvernekoscanlations.home.blog/who-dares-slander-my-senior-brother/",
              "silver2": "https://silvernekoscanlations.home.blog/thriller-trainee-tltn/",
              "lazy1": "https://lazybirdtranslations.wordpress.com/the-prestigious-familys-young-lady-and-the-farmer/",
              "lazy2": "https://lazybirdtranslations.wordpress.com/the-ultimate-business-lady/",
              "lemon1": "https://lemontreetranslations.wordpress.com/di-daughters-rebirth/",
              "lemon2": "https://lemontreetranslations.wordpress.com/qt-second-female-lead/",
              "dobelyu1": "https://dobelyuwai.wordpress.com/ano-otomege-wa-oretachi-ni-kibishii-sekai-desu/",
              "dobelyu2": "https://dobelyuwai.wordpress.com/to-be-power-in-the-shadow/",
              "wuxia1": "https://wuxia.click/novel/renegade-immortal",
              "wuxia2": "https://wuxia.click/novel/shadow-slave",
              "sonic1": "https://www.sonicmtl.com/novel/complete-martial-arts-attributes/",
              "sonic2": "https://www.sonicmtl.com/novel/beast-taming-starting-from-zero/",
              "sil1": "https://www.silmarillionwritersguild.org/node/9379/fanwork",
              "sil2": "https://www.silmarillionwritersguild.org/node/9758/fanwork",
              "fanfic1": "https://fanfic.es/readfic/2343-El-f%C3%A9nix-de-Credence",
              "fanfic2": "https://fanfic.es/readfic/941-Sangre-y-fuego-y-otras-magias-extra%C3%B1as",
              "fanfic3": "https://fanfic.es/readfic/2416-Cabritos",
              "asian1": "https://www.asianovel.net/story/3925/",
              "asian2": "https://www.asianovel.net/story/3921/",
              "fanficabook": "https://jeconais.fanficauthors.net/Hogwarts_Dawn/index/",
          }

          def label(s, length=80):
              return " ".join(s.split())[:length]

          def describe(n):
              return label(n.tag+"#"+n.get("id","")+"."+n.get("class",""), 115)

          def load(url):
              with urlopen(Request(url, headers={"User-Agent":"TextDownloader/1.0","Accept":"text/html"}), timeout=8) as response:
                  return response.geturl(), fromstring(response.read(6*1024*1024), parser=HTMLParser(encoding="utf8"))

          def shape(url, doc):
              result = []
              for node in doc.xpath("//p/parent::*|//div[./br]|//div[./text()[string-length(normalize-space(.))>100]]|//section[./p]"):
                  l = sum(len(t.strip()) for t in node.xpath("./text()|./p//text()") if t and t.strip())
                  if l >= 200:
                      result.append((l, " > ".join(describe(a) for a in [node,*list(node.iterancestors())[:3]])))
              result=sorted(set(result),reverse=True)[:5]
              return f"{url} title={label(doc.xpath('string(//title)'))!r} canonical={doc.xpath('//link[@rel=\"canonical\"]/@href')[:1]!r} shapes={result!r}"

          def probe(item):
              name, url = item
              try:
                  url,doc=load(url)
                  uri=urlsplit(url)
                  links={}
                  for a in doc.xpath("//a[@href]"):
                      raw=a.get("href")
                      if raw.startswith(("#","javascript:","?")): continue
                      href=urljoin(url,raw)
                      t=urlsplit(href)
                      if t.hostname!=uri.hostname or t.path==uri.path or href in links:continue
                      name_text=label(a.text_content(), 75)
                      body_region=any("entry-content" in (n.get("class") or "") or n.get("id")=="main" for n in a.iterancestors())
                      desc=describe(a)
                      rank=0
                      if re.search(r"(prologue|prólogo|序章|chapter[-_ ]?0(?!\d)|^(?:start reading|read first)$)", name_text, re.I):
                          rank+=55
                      if re.search(r"(chapter[-_ ]?0*1(?!\d)|part[-_ ]?0*1(?!\d)|^(?:chapter |chapter|act )?1(?:[. :—–-]|$))",name_text,re.I):
                          rank+=35
                      if re.search(r"(chapter|prologue|epilogue|ch-?[0-9]|[0-9]/[0-9]{2}/[0-9]{2}|/vol(?:ume)?|/chapter/)",t.path,re.I):
                          rank+=20
                      if body_region:rank+=10
                      if a.get("id") in ("btn-read-first", "btn-read-last") or a.get("rel")=="next":rank+=40
                      if "chapter-group__list-item-link" in (a.get("class") or ""):rank+=20
                      if name.startswith("fanfic") and "/readfic/" in t.path:rank+=30
                      if name.startswith("sil") and "#chapter" in href:rank+=60
                      if any(x in t.path for x in ("reviews","comment","author","terms","privacy","/tag/","/login","/category/")):rank-=25
                      if rank>0:
                          links[href]=(rank, t.path, name_text, desc, describe(a.getparent()), href)
                  candidates=sorted(links.values(),key=lambda x:-x[0])
                  result = [f"{name} {shape(url,doc)}", "links " + repr([v[1:5] for v in candidates[:10]])]
                  if name.startswith(("fanfic","sil")):
                      return "\n".join(result)
                  for candidate in candidates[:2]:
                      if candidate[0]<25:continue
                      try:
                          child, html=load(candidate[-1])
                          result.append(f"{name}chapter {shape(child,html)}")
                          nav=[(a.get('href'),label(a.text_content(),35),describe(a)) for a in html.xpath("//a[@href]") if a.get('rel')=='next' or 'next_page' in (a.get('class') or '') or a.get('aria-label') in ('Next', 'Next Chapter') or label(a.text_content(),35).lower().startswith(('next chapter','next→'))]
                          result.append("links " + repr(list(dict.fromkeys(nav))[:7]))
                      except Exception as e:
                          result.append(f"{name}chapter {candidate[-1]} {e}")
                  return "\n".join(result)
              except Exception as e:
                  return f"{name} {url} {e}"

          with ThreadPoolExecutor(max_workers=7) as pool:
              for result in pool.map(probe, works.items()):
                  print(result,flush=True)
          PY
