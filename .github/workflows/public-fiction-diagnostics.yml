name: Public fiction catalog diagnostics

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-fiction-diagnostics.yml']

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect catalog and reader markup
        run: |
          python3 -m pip install --quiet lxml
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.error import HTTPError
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          from lxml.html import fromstring, HTMLParser

          urls = {'fanficEs1': 'https://fanfic.es/readfic/2416-Cabritos', 'fanficEs2': 'https://fanfic.es/readfic/2411-Entre-Grietas-y-Mundos', 'fanficEs3': 'https://fanfic.es/readfic/2419-Sin-t%C3%ADtulo', 'silChapter': 'https://www.silmarillionwritersguild.org/node/9379/fanwork', 'silChapter2': 'https://www.silmarillionwritersguild.org/node/9758/fanwork', 'fanficacat': 'https://jeconais.fanficauthors.net/Harry_Potter/', 'fanficabook': 'https://jeconais.fanficauthors.net/Hogwarts_Dawn/index/', 'fanficabook2': 'https://jeconais.fanficauthors.net/Perfect_Slytherins__Tales_from_the_Fourth_Year/index/', 'authorToday': 'https://author.today/work', 'authorTodaycat': 'https://author.today/work/genre/fanfiction', 'ficbook': 'https://ficbook.net/fanfiction', 'novelokurC': 'https://novelokur.com.tr/chapter/bolum-1-bir-hap-tanrisinin-anilari/', 'sonicw': 'https://www.sonicmtl.com/novel/complete-martial-arts-attributes/', 'sonicc': 'https://www.sonicmtl.com/novel/complete-martial-arts-attributes/chapter-1/', 'novelcoolc': 'https://www.novelcool.com/chapter/Chapter-1-Not-Her-Fault/13452180/', 'novelcoolcat': 'https://www.novelcool.com/novel/search.html?type=Novel', 'wuxiaclick': 'https://wuxia.click/novel/renegade-immortal', 'wuxiaclickc': 'https://wuxia.click/novel/renegade-immortal/chapter-1', 'lemon1': 'https://lemontreetranslations.wordpress.com/di-daughters-rebirth/', 'lemon2': 'https://lemontreetranslations.wordpress.com/qt-second-female-lead/', 'lazybird1': 'https://lazybirdtranslations.wordpress.com/the-prestigious-familys-young-lady-and-the-farmer/', 'lazybird2': 'https://lazybirdtranslations.wordpress.com/the-ultimate-business-lady/', 'asiannovelc': 'https://www.asianovel.net/chapter/chapter-941880/', 'puretl': 'https://puretl.com/translations', 'hui': 'https://hui3r.wordpress.com/category/books/', 'ancient': 'https://ancientheartloss.wordpress.com/light-novels/', 'inadequate': 'https://inadequatetranslations.wordpress.com/stories/', 'cc': 'https://cclawtranslations.home.blog/completed-projects/', 'infinite': 'https://infinitenoveltranslations.net/light-novels/', 'relibrary': 'https://re-library.com/translations/', 'tomo': 'https://tomotranslations.com/translations/', 'silver': 'https://silvernekoscanlations.home.blog/novels/', 'otaku': 'https://otakutl.blogspot.com/p/list-of-translations.html', 'litnet': 'https://litnet.com/ru/top/fanfik', 'booknet': 'https://booknet.ua/reader/stanu-tob-tatom-b429253?c=4644577', 'whizzercat': 'https://whatsawhizzerwebnovels.com/novels/', 'fuyuA': 'https://www.fuyuneko.org/blog-1/aacw/ch-001', 'fuyuB': 'https://www.fuyuneko.org/manatee/mstp/ch-001', 'fringeC': 'https://www.fringecapybara.com/mmlb-toc'}

          def clean(value, limit=200):
              return " ".join(value.split())[:limit]

          def describe(node):
              return clean(node.tag + "#" + node.get("id", "") + "." + node.get("class", ""), 130)

          def probe(item):
              name, url = item
              try:
                  with urlopen(Request(url, headers={"User-Agent": "TextDownloader/1.0", "Accept": "text/html,application/xhtml+xml"}), timeout=9) as response:
                      response_url = response.geturl()
                      html = response.read(5 * 1024 * 1024)
                      doc = fromstring(html, parser=HTMLParser(encoding="utf8"))
                  text = [f"{name} {response_url} {len(html)} {clean(doc.xpath('string(//title)'))}"]
                  text.append("head " + repr([(describe(h), len(h.text_content())) for h in doc.xpath("//h1|//h2")[:7]]) +
                              " canonical " + repr(doc.xpath("//link[@rel='canonical']/@href")[:3]))
                  props = {describe(a):sum(len(p.text_content()) for p in a.xpath("./p")) for a in doc.xpath("//p/parent::* | //div[./br]")}
                  blocks=[]
                  for tag in doc.xpath("//div|//section|//article|//main|//pre|//td"):
                      length=sum(len(t.strip()) for t in tag.xpath("./text()|./p/text()") if t and t.strip())
                      if length >= 100:
                          blocks.append((length,describe(tag),describe(tag.getparent())))
                  text.append("prose " + repr(sorted(props.items(), key=lambda x:-x[1])[:3]) + "; direct " +
                              repr(sorted(blocks,reverse=True)[:7]))
                  links = {}
                  for node in doc.xpath("//a[@href]|//option[@value]"):
                      path = node.get("href", node.get("value",""))
                      target = urlsplit(urljoin(response_url, path))
                      if not path or path.startswith(("#", "javascript:")) or target.hostname != urlsplit(response_url).hostname:
                          continue
                      short = clean(node.text_content(), 55)
                      rank = 0
                      signals = ("chapter", "read first", "first chapter", "start reading", "contents", "next", "/book/", "/novel/", "viewstory", "s/", "chapit", "开始", "第一", "阅读")
                      mark = " ".join((path, short, node.get("id",""), node.get("class",""))).lower()
                      if any(k in mark for k in signals):
                          rank += 5
                      if "first" in mark or "chapter-1/" in mark or "starts" in mark or "chuong-1" in mark or "bab-1" in mark or short.lower() == "last" or ".txt" in mark:
                          rank += 4
                      if short.lower() in ("last", "first", "next", "read", "читать", "читати", "start reading") or "chapter-1/" in mark:
                          rank += 10
                      if target.path.startswith(("/story/", "/stories/", "/fiction/", "/works/", "/read/", "/books/read/", "/chapters/", "/reader/", "/novel/", "/obra/", "/fics/", "/fanfic/")) and target.path.strip("/").count("/") > 0:
                          rank += 10
                      if name.startswith("fanficEs") and ("fanfic-title" in describe(node.getparent()) or any(v in mark for v in ("read_fanfic", "fanfic-title", "fanfic_name", "/fanfic/", "/readfic/", "/obra/", "/fic/"))):
                          rank += 20
                      if name.startswith("sil") and any(t in mark for t in ("/node/", "fiction", "works", "fanwork")):
                          rank += 20
                      if name.startswith("firefly") and any(t in mark for t in (".asp", "read", "bluesun", "fanfic")):
                          rank += 20
                      if name == "bloodshed" and any(t in mark for t in ("chapter", "story", "fic", "browse")):
                          rank += 20
                      if name.startswith("booknet") and ("page=" in target.query or "наступ" in mark or "next" in mark):
                          rank += 40
                      if name.startswith("fanficac") and target.path.endswith("/index/"):
                          rank += 35
                      if name.startswith(("lemon", "lazybird", "novelokur", "snowy")) and ("chapter" in mark or "prologue" in mark or "bölüm" in mark):
                          if "first" in mark or "/1/" in mark or "-1/" in mark or short.lower().startswith(("chapter 1 ", "chapter 1 –", "chapter 1:", "chapter 1.", "prologue")):
                              rank += 100
                          rank += 40
                      if name.startswith(("puretl","hui","ancient","inadequate","cc","infinite","relibrary","tomo","silver","otaku")) and any(t in mark for t in ("toc", "contents", "novels", "novel", "volume", "project")):
                          rank += 35
                      if name.startswith("fanficabook") and target.path.strip("/").count("/")==1 and target.path.split("/")[1]==urlsplit(response_url).path.split("/")[1]:
                          rank += 35
                      if name.startswith("wuxia") and target.path.startswith("/chapter/"):
                          rank += 35
                      if name.startswith("novelspl"):
                          rank = 20 if "p=" in target.query or ".html" in target.path else rank
                      if name in ("fringeCatalog","fuyu","fuyu1") and any(t in mark for t in ("toc", "/vbms", "/cfm", "/chongfei", "/work", "/chapter")):
                          rank += 15
                      absolute = target.path + (("?" + target.query) if target.query else "")
                      if absolute in links:
                          continue
                      links[absolute] = (rank, clean(absolute,160), short, describe(node))
                  text.append("links " + repr([entry[1:] for entry in sorted(links.values(), key=lambda x:-x[0])[:21]]))
                  return "\n".join(text)
              except HTTPError as error:
                  return f"{name} HTTP {error.code} {error.geturl()}"
              except Exception as error:
                  return f"{name} {error}"

          with ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(probe, urls.items()):
                  print(result, flush=True)
          PY
