name: Public fiction catalog diagnostics

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/public-fiction-diagnostics.yml']

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect catalog and reader markup
        run: |
          python3 -m pip install --quiet lxml
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.error import HTTPError
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          from lxml.html import fromstring

          urls = {
              "chireads": "https://chireads.com/category/translatedtales/le-monde-des-mages/",
              "chireads2": "https://chireads.com/category/translatedtales/battle-through-the-heavens/",
              "exiled1": "https://exiledrebelsscanlations.com/novels/the-archmage-and-his-dragon/",
              "exiled2": "https://exiledrebelsscanlations.com/novels/mary-sue-a-faithful-adaptation/",
              "exiled3": "https://exiledrebelsscanlations.com/novels/defeating-magic-with-science/",
              "exiled4": "https://exiledrebelsscanlations.com/novels/i-am-a-chef-in-the-modern-era/",
              "exiled5": "https://exiledrebelsscanlations.com/novels/after-becoming-a-mermaid-i-was-raised/",
              "nine": "https://www.ninelivesarchive.com/viewstory.php?sid=2158&chapter=1",
              "lumos": "https://lumos.sycophanthex.com/viewstory.php?sid=2865&chapter=1",
              "chaos": "https://chaos.sycophanthex.com/viewstory.php?sid=2179&chapter=1",
              "midnight": "https://midnightwhispers.net/viewstory.php?sid=4510&chapter=1",
              "efp": "https://efpfanfic.net/viewstory.php?sid=4157128&i=1",
              "ddtxt": "https://www.ddtxt8.cc/book/198/1.html",
              "sfacg": "https://book.sfacg.com/Novel/785681/MainIndex/",
              "17k": "https://www.17k.com/list/3684636.html",
              "luminare": "https://luminaretranslations.com/series/fun-with-music/chapter-1",
              "wuxia": "https://www.wuxiaworld.com/novel/ready-set-apocalypse/rsa-chapter-1",
              "novelcool": "https://www.novelcool.com/novel/original/id-263564.html",
              "novelzhen": "https://novelzhen.com/novel/reverend-insanity",
              "ranah": "https://ranahnovel.com/novel/reverend-insanity",
              "novello": "https://novello.id/book/the-early-spring",
              "siye": "https://www.siye.co.uk/viewstory.php?sid=130812",
              "sfarchive": "https://scifistories.com/list/1/top_50_serials_by_weekly_downloads",
              "novelspl": "https://www.novels.pl/novel/Reborn-as-the-Doomed-Heir-of-a-Mage-Dynasty?p=100",
              "portme": "https://fanfiction.com.br/",
              "fantasynovels": "https://novelasligeras.net/",
              "tale": "https://www.inkitt.com/fanfiction",
              "redtale": "https://rdtl.net/",
          }

          def clean(value, limit=200):
              return " ".join(value.split())[:limit]

          def describe(node):
              return clean(node.tag + "#" + node.get("id", "") + "." + node.get("class", ""), 130)

          def probe(item):
              name, url = item
              try:
                  with urlopen(Request(url, headers={"User-Agent": "TextDownloader/1.0", "Accept": "text/html,application/xhtml+xml"}), timeout=9) as response:
                      response_url = response.geturl()
                      html = response.read(5 * 1024 * 1024)
                      doc = fromstring(html)
                  text = [f"{name} {response_url} {len(html)} {clean(doc.xpath('string(//title)'))}"]
                  text.append("head " + repr([(describe(h), len(h.text_content())) for h in doc.xpath("//h1|//h2")[:7]]))
                  props = {describe(a):sum(len(p.text_content()) for p in a.xpath("./p")) for a in doc.xpath("//p/parent::* | //div[./br]")}
                  text.append("prose " + repr(sorted(props.items(), key=lambda x:-x[1])[:6]))
                  links = {}
                  for node in doc.xpath("//a[@href]|//option[@value]"):
                      path = node.get("href", node.get("value",""))
                      target = urlsplit(urljoin(response_url, path))
                      if not path or path.startswith(("#", "javascript:")) or target.hostname != urlsplit(response_url).hostname:
                          continue
                      short = clean(node.text_content(), 55)
                      rank = 0
                      signals = ("chapter", "read first", "first chapter", "start reading", "contents", "next", "/book/", "/novel/", "viewstory", "s/", "chapit", "开始", "第一", "阅读")
                      mark = " ".join((path, short, node.get("id",""), node.get("class",""))).lower()
                      if any(k in mark for k in signals):
                          rank += 5
                      if "first" in mark or "chapter-1/" in mark or "starts" in mark:
                          rank += 4
                      absolute = target.path + (("?" + target.query) if target.query else "")
                      if absolute in links:
                          continue
                      links[absolute] = (rank, clean(absolute,160), short, describe(node))
                  text.append("links " + repr([entry[1:] for entry in sorted(links.values(), key=lambda x:-x[0])[:12]]))
                  return "\n".join(text)
              except HTTPError as error:
                  return f"{name} HTTP {error.code} {error.geturl()}"
              except Exception as error:
                  return f"{name} {error}"

          with ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(probe, urls.items()):
                  print(result, flush=True)
          PY
