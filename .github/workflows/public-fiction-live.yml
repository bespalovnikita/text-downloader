name: Public fiction site checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/TextDownloader.Core/Sources/PublicFiction/PublicFictionSites*.cs'
      - '.github/workflows/public-fiction-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-fiction:
    name: Download and validate public chapters
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify sites from the latest batch
        if: github.event_name == 'pull_request'
        run: dotnet run --project tests/TextDownloader.Core.Tests -c Release -- --live-public-sites --latest-batch
      - name: Verify all sites
        if: github.event_name == 'workflow_dispatch'
        run: dotnet run --project tests/TextDownloader.Core.Tests -c Release -- --live-public-sites
